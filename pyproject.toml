[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "automotive-edge-ai-inference-harness"
version = "1.0.0"
description = "Host-verified automotive sensor ML, ONNX export, and fixed-size int8 C inference"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=2.1,<3",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "scikit-learn>=1.6,<1.8",
  "skl2onnx>=1.18,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]
local-toolchain = [
  "cmake>=3.31,<5",
  "ninja>=1.11,<2",
  "ziglang>=0.14,<0.16",
]

[project.scripts]
edge-ai = "edge_ai.cli:main"

[tool.setuptools.packages.find]
include = ["edge_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
